[project]
name = "kisan-saathi"
version = "0.1.0"
description = "WhatsApp-first voice assistant for Indian farmers"
readme = "README.md"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
addopts = "-v --tb=short --timeout=60"
markers = [
    "asyncio: mark test as async",
    "live: live integration tests requiring real API keys",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::starlette.testclient.StarletteDeprecationWarning",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "B008"]
